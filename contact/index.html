<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Contact</title>
  <meta name="description" content="Contact Matt Mueller. For booking, use the booking inquiry form or email contact@mattmuellermusic.com.">
  <link rel="canonical" href="https://mattmuellermusic.com/contact/">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Matt Mueller">
  <meta property="og:title" content="Matt Mueller | Contact">
  <meta property="og:description" content="Contact Matt Mueller. For booking, use the booking inquiry form or email contact@mattmuellermusic.com.">
  <meta property="og:url" content="https://mattmuellermusic.com/contact/">
  <meta property="og:image" content="https://mattmuellermusic.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/assets/favicon.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- Site Styles -->
  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* Thank you message styling */
    #thank-you-message {
      display: none;
      text-align: center;
      margin-top: 40px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      color: #5D72A2;
    }

  </style>
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Page Content -->
  <section class="page-content">
    <h1>Contact</h1>
    <p class="contact-email"><strong>Booking a show?</strong> Use the <a href="/booking">booking inquiry form</a> so we get your date, venue, and format up front.</p>
    <p class="contact-email">Everything else: send a note below or email <a href="mailto:contact@mattmuellermusic.com">contact@mattmuellermusic.com</a>.</p>

    <form id="contact-form">
      <!-- StaticForms API Key -->
      <input type="hidden" name="accessKey" value="sf_c1h9aam4hm7lgg5715g0i4i2">

      <!-- Disable captcha -->
      <input type="hidden" name="captcha" value="false">
      <input type="hidden" name="subject" value="New message: mattmuellermusic.com">

      <!-- Honeypot spam protection -->
      <input type="text" name="honeypot" style="display:none">

      <label>
        Name
        <input type="text" name="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Message
        <textarea name="message" rows="5" required></textarea>
      </label>

      <button type="submit">Send Message</button>
    </form>

    <!-- Thank you message -->
    <div id="thank-you-message">
      <p>Thank you for your message! We'll be in touch soon.</p>
    </div>
  </section>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Site Scripts -->
  <script src="/js/main.js"></script>

  <!-- Contact Form Script -->
  <script>
    const form = document.getElementById('contact-form');
    const thankYou = document.getElementById('thank-you-message');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = new FormData(form);

      fetch('https://api.staticforms.xyz/submit', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.success === false) throw new Error(data.message || 'Submit failed');
        // Hide form
        form.style.display = 'none';
        // Show thank you
        thankYou.style.display = 'block';
      })
      .catch(err => {
        console.error('Form submission error:', err);
        alert('Something went wrong. Please try again.');
      });
    });
  </script>

</body>
</html>
