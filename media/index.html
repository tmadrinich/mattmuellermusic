<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Media</title>
  <meta name="description" content="Stream Matt Mueller's latest releases and see photos from the studio and stage.">
  <link rel="canonical" href="https://mattmuellermusic.com/media/">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Matt Mueller">
  <meta property="og:title" content="Matt Mueller | Media">
  <meta property="og:description" content="Stream Matt Mueller's latest releases and see photos from the studio and stage.">
  <meta property="og:url" content="https://mattmuellermusic.com/media/">
  <meta property="og:image" content="https://mattmuellermusic.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/assets/favicon.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- Site Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="media-page">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Full-page background photo (fixed; cards scroll over it) -->
  <div class="media-bg" aria-hidden="true"></div>

  <main class="media-stack">

  <!-- Latest Releases -->
<section class="page-content media-card latest-releases">
  <h1>Latest Releases</h1>
  <div class="embed-wrapper">
    <iframe
      src="https://open.spotify.com/embed/artist/79YZOjggALPQngm5TV6dii"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>
</section>


  <!-- Photos Carousel -->
  <section class="page-content media-card photos-carousel">
    <h1>Photos</h1>
    <div class="carousel">
      <button class="carousel-btn prev" aria-label="Previous">
        <i class="fas fa-chevron-left"></i>
      </button>

      <div class="carousel-track">
        <img src="/assets/gallery1.jpg" alt="Recording session 1">
        <img src="/assets/gallery2.jpg" alt="Recording session 2">
        <img src="/assets/gallery3.jpg" alt="Recording session 3">
        <img src="/assets/gallery4.jpg" alt="Recording session 4">
        <img src="/assets/gallery5.jpg" alt="Recording session 5">
      </div>

      <button class="carousel-btn next" aria-label="Next">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </section>
  </main>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Site JS -->
  <script src="/js/main.js"></script>


</body>
</html>
