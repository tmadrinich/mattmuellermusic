<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Media</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/mattmuellerlogo.png">
  <link rel="shortcut icon" type="image/png" href="/assets/mattmuellerlogo.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- Site Styles -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Override for section headers in media page */
    .page-content h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2.5rem;
      color: #5D72A2; /* brand blue */
      text-align: center;
      margin-bottom: 25px;
    }

    .page-content p {
      color: #C0C0C0;
      text-align: center;
      max-width: 800px;
      margin: 0 auto 40px auto;
    }

    /* Carousel override */
    .carousel {
      position: relative;
      max-width: 900px;
      margin: 40px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease;
    }

    .carousel img {
      width: 100%;
      flex-shrink: 0;
      object-fit: cover;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: #C0C0C0;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 2;
    }

    .carousel-btn:hover {
      color: #5D72A2;
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    /* Spotify embed wrapper */
    .embed-wrapper {
      display: flex;
      justify-content: center;
      margin: 40px auto;
    }

    .embed-wrapper iframe {
      width: 90%;
      max-width: 800px;
      min-width: 280px;
      height: 352px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Media Intro -->
  <section class="page-content">
    <h1>Media</h1>
    <p>Please reach out for full EPK</p>
  </section>

  <!-- Latest Releases -->
  <section class="page-content">
    <h1>Latest Releases</h1>
    <div class="embed-wrapper">
      <iframe
        src="https://open.spotify.com/embed/artist/79YZOjggALPQngm5TV6dii"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </div>
  </section>

  <!-- Photos Carousel -->
  <section class="page-content">
    <h1>Photos</h1>
    <div class="carousel">
      <button class="carousel-btn prev" aria-label="Previous">
        <i class="fas fa-chevron-left"></i>
      </button>

      <div class="carousel-track">
        <img src="assets/gallery1.jpg" alt="SS1">
        <img src="assets/gallery2.jpg" alt="SS2">
        <img src="assets/gallery3.jpg" alt="SS3">
        <img src="assets/gallery4.jpg" alt="SS4">
        <img src="assets/gallery5.jpg" alt="SS5">
      </div>

      <button class="carousel-btn next" aria-label="Next">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </section>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Site JS -->
  <script src="js/main.js"></script>

  <!-- Carousel JS -->
  <script>
    const track = document.querySelector('.carousel-track');
    const slides = Array.from(track.children);
    const nextBtn = document.querySelector('.carousel-btn.next');
    const prevBtn = document.querySelector('.carousel-btn.prev');

    let index = 0;

    function updateCarousel() {
      track.style.transform = `translateX(-${index * 100}%)`;
    }

    nextBtn.addEventListener('click', () => {
      index = (index + 1) % slides.length;
      updateCarousel();
    });

    prevBtn.addEventListener('click', () => {
      index = (index - 1 + slides.length) % slides.length;
      updateCarousel();
    });

    // Mobile swipe support
    let startX = 0;

    track.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    });

    track.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].clientX - startX;
      if (diff > 50) prevBtn.click();
      if (diff < -50) nextBtn.click();
    });
  </script>

</body>
</html>
