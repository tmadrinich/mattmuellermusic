<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Media</title>

  <!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/mattmuellerlogo.png">
<link rel="shortcut icon" type="image/png" href="/assets/mattmuellerlogo.png">


  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Page Content -->
  <section class="page-content">
    <h1>Media</h1>
    <p>Watch videos, listen to recordings, and explore photos from studio sessions and live performances. Experience the full range of Matt Mueller’s musical artistry.</p>
  </section>
  
  <div class="embed-wrapper">
  <iframe
    src="https://open.spotify.com/embed/artist/79YZOjggALPQngm5TV6dii"
    frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>
<div class="carousel">
  <button class="carousel-btn prev" aria-label="Previous">
    <i class="fas fa-chevron-left"></i>
  </button>

  <div class="carousel-track">
    <img src="assets/gallery1.jpg" alt="Live show">
    <img src="assets/gallery2.jpg" alt="On stage">
    <img src="assets/gallery3.jpg" alt="Studio session">
  </div>

  <button class="carousel-btn next" aria-label="Next">
    <i class="fas fa-chevron-right"></i>
  </button>
</div>



  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <script src="js/main.js"></script>
</body>
</html>
