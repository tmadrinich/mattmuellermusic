<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Shows</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- Site Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Shows / Calendar Section -->
  <section id="calendar-section">
    <h2>Upcoming Shows</h2>

    <div id="events-container">
      <p>Loading upcoming shows...</p>
    </div>
  </section>

  <!-- Google Calendar Integration -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const calendarId =
        'ae68da38e08ac4ce31d9d9e455888be40c2f232b12f3a961f180208b79c1a038@group.calendar.google.com';

      const apiKey = 'AIzaSyBT4GHGzgD9RfWmRQKJqROkhLNj9jJEBeU';
      const maxEvents = 10;

      const url =
        'https://www.googleapis.com/calendar/v3/calendars/' +
        encodeURIComponent(calendarId) +
        '/events' +
        '?key=' + apiKey +
        '&timeMin=' + new Date().toISOString() +
        '&singleEvents=true' +
        '&orderBy=startTime' +
        '&maxResults=' + maxEvents;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('events-container');

          if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p>No upcoming shows.</p>';
            return;
          }

          container.innerHTML = data.items.map(event => {
            const date = new Date(event.start.dateTime || event.start.date)
              .toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
              });

            return `
              <div class="event-card">
                <div class="event-date">${date}</div>
                <div class="event-title">${event.summary || 'Show'}</div>
                ${event.location ? `<div class="event-location">@ ${event.location}</div>` : ''}
              </div>
            `;
          }).join('');
        })
        .catch(err => {
          console.error('Calendar error:', err);
          document.getElementById('events-container').innerHTML =
            '<p>Failed to load events.</p>';
        });
    });
  </script>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Site JS -->
  <script src="js/main.js"></script>

</body>
</html>
