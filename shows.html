<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Shows</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

<section id="calendar-section">
  <h2>Upcoming Shows</h2>
  <div id="events-container">
    <p>Loading upcoming shows...</p>
  </div>
</section>

<!-- Google Calendar JS -->
<script>
const calendarId = 'ae68da38e08ac4ce31d9d9e455888be40c2f232b12f3a961f180208b79c1a038@group.calendar.google.com'; // Replace with your calendar ID
const apiKey = 'YOUR_API_KEY'; // Replace with your Google API key
const maxEvents = 10; // Number of upcoming events to display

fetch(`https://www.googleapis.com/calendar/v3/calendars/${calendarId}/events?key=${apiKey}&timeMin=${new Date().toISOString()}&maxResults=${maxEvents}&orderBy=startTime&singleEvents=true`)
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('events-container');
    if (!data.items || data.items.length === 0) {
      container.innerHTML = '<p>No upcoming shows.</p>';
      return;
    }

    container.innerHTML = data.items.map(event => {
      const dateObj = new Date(event.start.dateTime || event.start.date);
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      const date = dateObj.toLocaleDateString('en-US', options);
      const title = event.summary || 'Show';
      const location = event.location ? `@ ${event.location}` : '';
      return `
        <div class="event-card">
          <div class="event-date">${date}</div>
          <div class="event-title">${title}</div>
          <div class="event-location">${location}</div>
        </div>
      `;
    }).join('');
  })
  .catch(err => {
    console.error(err);
    document.getElementById('events-container').innerHTML = '<p>Failed to load events.</p>';
  });
</script>


  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <script src="js/main.js"></script>
</body>
</html>
