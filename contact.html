<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Contact</title>

  <!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/mattmuellerlogo.png">
<link rel="shortcut icon" type="image/png" href="/assets/mattmuellerlogo.png">


  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Page Content -->
  <section class="page-content">
  <h1>Contact</h1>

  <form
    action="https://api.staticforms.xyz/submit"
    method="POST"
  >
    <!-- StaticForms API Key -->
    <input type="hidden" name="accessKey" value="sf_c1h9aam4hm7lgg5715g0i4i2">

    <!-- Disable captcha -->
    <input type="hidden" name="captcha" value="false">

    <!-- Honeypot spam protection -->
    <input type="text" name="honeypot" style="display:none">

    <!-- Redirect after success -->
    <input type="hidden" name="redirectTo" value="https://mattmuellermusic.com/thank-you.html">

    <label>
      Name
      <input type="text" name="name" required>
    </label>

    <label>
      Email
      <input type="email" name="email" required>
    </label>

    <label>
      Message
      <textarea name="message" rows="5" required></textarea>
    </label>

    <button type="submit">Send Message</button>
  </form>
</section>


  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <script src="js/main.js"></script>
</body>
</html>
