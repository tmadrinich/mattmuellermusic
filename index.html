<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
    :root {
      --black: #000000;
      --silver: #C0C0C0;
      --accent-blue: #5D72A2;
    }

    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lato', sans-serif;
      background-color: var(--black);
      color: var(--silver);
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 3rem;
      color: var(--accent-blue);
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.2rem;
      color: var(--silver);
    }

    .hero {
      height: 100vh;
      background: url('https://via.placeholder.com/1600x900') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--silver);
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-content h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 2.5rem;
      color: var(--accent-blue);
      margin-bottom: 1rem;
    }

    .hero-content a {
      display: inline-block;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      color: var(--black);
      background-color: var(--accent-blue);
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .hero-content a:hover {
      background-color: var(--silver);
      color: var(--black);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      background-color: var(--black);
      color: var(--silver);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      .hero-content h2 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Matt Mueller</h1>
    <p>Music | Art | Passion</p>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>Experience the Sound</h2>
      <a href="#contact">Listen Now</a>
    </div>
  </section>

  <footer>
    &copy; 2026 Matt Mueller. All rights reserved.
  </footer>

</body>
</html>
