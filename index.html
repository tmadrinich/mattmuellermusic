<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Mueller | Home</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/mattmuellerlogo.png">
  <link rel="shortcut icon" type="image/png" href="/assets/mattmuellerlogo.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous"
  />

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Pre-save Banner */
    .presave-banner {
      width: 100%;
      background: linear-gradient(90deg, #b8860b, #d4af37);
      color: #000;
      text-align: center;
      padding: 14px 20px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .presave-banner a {
      color: #000;
      text-decoration: none;
      margin-left: 10px;
      padding: 8px 16px;
      background: #fff;
      border-radius: 999px;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .presave-banner a:hover {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Pre-Save Banner -->
  <div class="presave-banner">
    Pre-Save “In Over My Head” Now
    <a href="https://distrokid.com/hyperfollow/mattmueller1/in-over-my-head?ref=release" target="_blank">
      Pre-Save
    </a>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h2>Listen Now</h2>
      <div class="music-links">

        <!-- Spotify -->
        <a href="https://open.spotify.com/artist/79YZOjggALPQngm5TV6dii" target="_blank" class="spotify-link" aria-label="Listen on Spotify">
          <i class="fab fa-spotify"></i>
        </a>

        <!-- Apple Music -->
        <a href="https://music.apple.com/artist/matt-mueller/1788445729" target="_blank" class="apple-link" aria-label="Listen on Apple Music">
          <i class="fab fa-apple"></i>
        </a>

        <!-- YouTube Music -->
        <a href="https://youtube.com/@mattmuellermusic?si=ACuVI2WHDuyewpUD" target="_blank" class="youtube-link" aria-label="Listen on YouTube Music">
          <i class="fab fa-youtube"></i>
        </a>

        <!-- Amazon Music -->
        <a href="https://music.amazon.com/artists/B07Q57PZ4Q/matt-mueller" target="_blank" class="amazon-link" aria-label="Listen on Amazon Music">
          <i class="fab fa-amazon"></i>
        </a>

      </div>
    </div>
  </section>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Main JS -->
  <script src="js/main.js"></script>
</body>
</html>
